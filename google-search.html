<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Google</title>
    <style>
        p {
            margin: 0px;
        }
        .p-1{
            font-size: 17px;
        }
        .p-2{
            font-size: 14px;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="header">
            <img src="google-1.jpg" width="500" height="180" alt="google-1">
        </div>
        <div class="section">
            <p>
                <center>Search the web using Google!</center>
            </p>
            <input type="text" name="search" id="input-1">
            <div class="clear"></div>
            <a href=""><input class="butt" type="button" value="Google Search"></a>
            <a href=""><input class="butt" type="button" value="I'm feelink lucky"></a>
        </div>
        <div class="content">
            <div class="box-1" style="background-color: rgb(13, 244, 244);">
                <p class="p-1"><strong>Special Searches</strong></p>
                <p class="p-1"><a href="https://profiles.stanford.edu/">Stanford Search</a></p>
                <p class="p-1"><a href="https://www.linuxjournal.com/content/how-search-and-find-files-text-strings-linux">Linux Search</a></p>
            </div>
            <div class="box-2" style="width: 200px; background-color: rgb(10, 202, 193);">
                <p class="p-2"><a href="https://support.google.com/">Help?</a></p>
                <p class="p-2"><a href="https://about.google/intl/tr_ALL/">About Google!</a></p>
                <p class="p-2"><a href="https://companyinfo.nl/en/">Company Info</a></p>
                <p class="p-2"><a href="https://doodles.google/">Google! Logos</a></p>    
            </div>
            <div class="box-3" style="background-color: rgb(8, 174, 165);">
                <p>
                    Get Google! <br>
                    updates monthly:
                </p>
                <input type="text" name="search" id="input-2" value="Your e-mail"><br>
                <a href=""><input class="butt" type="button" value="Subscribe"></a>
                <a href="https://news.google.com/home?as_drrb=a&hl=tr&gl=TR&ceid=TR:tr">Archive</a>
            </div>
        </div>
    </div>
</body>

</html>
